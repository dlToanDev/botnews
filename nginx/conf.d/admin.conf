# ============================================================================
# Site config Web Admin — Phase 4 (mục 4.3)
# ⚠️ Thay TẤT CẢ "admin.yourdomain.com" bằng domain thật trước khi deploy:
#     sed -i 's/admin.yourdomain.com/admin.hvpgroup.vn/g' nginx/conf.d/admin.conf
# ============================================================================

# Chặn truy cập bằng IP thô / Host header lạ (không lộ admin cho scanner).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# --- HTTP: phục vụ ACME challenge + redirect phần còn lại sang HTTPS ---
server {
    listen 80;
    server_name admin.yourdomain.com;

    # Certbot webroot (giữ trên HTTP để renew được).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy tới web:8000 ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;

    # SSL hardening (khuyến nghị Mozilla intermediate).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — buộc trình duyệt luôn dùng HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # (Tùy chọn) IP allowlist — chỉ IP của bạn vào được admin.
    # Bỏ comment và đổi IP; mọi IP khác nhận 403.
    # allow 203.0.113.10;
    # deny  all;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
