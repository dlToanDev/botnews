# ============================================================================
# Compose "chạy chung VPS" — dùng khi VPS ĐÃ có web khác giữ cổng 80/443.
# Khác bản prod: KHÔNG có nginx + certbot. Web Admin chỉ mở ở 127.0.0.1:8010
# (localhost VPS) để web/nginx sẵn có reverse-proxy sang — không đụng cổng,
# không lộ DB/Redis ra ngoài.
#
# Chạy:  docker compose -f docker-compose.coexist.yml up -d
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=50
      -c effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    # KHÔNG expose port — chỉ trong docker network.

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  bot:
    build: .
    restart: always
    logging: *default-logging
    command: python -m app.bot.main
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    restart: always
    logging: *default-logging
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    build: .
    restart: always
    logging: *default-logging
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build: .
    restart: always
    logging: *default-logging
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    # CHỈ mở ra localhost của VPS (không phải 0.0.0.0) → web cũ/nginx proxy sang.
    # Đổi 8010 nếu cổng đó đã bị dùng.
    ports:
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
