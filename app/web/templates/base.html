<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotNews Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="flex min-h-screen">
    <aside class="w-56 bg-slate-900 text-slate-200 flex flex-col">
        <div class="px-5 py-4 text-lg font-bold border-b border-slate-700">🤖 BotNews</div>
        <nav class="flex-1 px-2 py-4 space-y-1 text-sm">
            <a href="/" class="block px-3 py-2 rounded hover:bg-slate-700">📊 Dashboard</a>
            <a href="/users" class="block px-3 py-2 rounded hover:bg-slate-700">👥 Users</a>
            <a href="/logs" class="block px-3 py-2 rounded hover:bg-slate-700">📜 Logs</a>
        </nav>
        <div class="px-4 py-3 border-t border-slate-700 text-xs">
            <div class="mb-2 text-slate-400">👤 {{ admin.username }}</div>
            <a href="/logout" class="text-red-400 hover:underline">Đăng xuất</a>
        </div>
    </aside>
    <main class="flex-1 p-8">
        <h1 class="text-2xl font-semibold mb-6">{% block heading %}{% endblock %}</h1>
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
