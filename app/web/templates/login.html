<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — BotNews Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <form method="post" action="/login" class="bg-white rounded-xl shadow-lg p-8 w-80 space-y-4">
        <div class="text-center text-xl font-bold">🤖 BotNews Admin</div>
        {% if error %}
        <div class="bg-red-100 text-red-700 text-sm rounded px-3 py-2">{{ error }}</div>
        {% endif %}
        <input name="username" placeholder="Tài khoản" required
               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        <input name="password" type="password" placeholder="Mật khẩu" required
               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded py-2 font-medium">
            Đăng nhập
        </button>
    </form>
</body>
</html>
