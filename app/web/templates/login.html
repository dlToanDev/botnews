<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — BotNews Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center min-h-screen p-4">
    <form method="post" action="/login" class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm space-y-5">
        <div class="text-center">
            <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-blue-600 text-white text-2xl">🤖</div>
            <div class="text-xl font-bold text-slate-900">BotNews Admin</div>
            <div class="text-sm text-slate-400">Đăng nhập để tiếp tục</div>
        </div>
        {% if error %}
        <div class="bg-rose-50 text-rose-700 text-sm rounded-lg px-3 py-2 ring-1 ring-rose-200">{{ error }}</div>
        {% endif %}
        <input name="username" placeholder="Tài khoản" required
               class="w-full rounded-lg border border-slate-200 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">
        <input name="password" type="password" placeholder="Mật khẩu" required
               class="w-full rounded-lg border border-slate-200 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400">
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2.5 font-semibold shadow-sm">
            Đăng nhập
        </button>
    </form>
</body>
</html>
