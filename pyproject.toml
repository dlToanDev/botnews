[project]
name = "botnews"
version = "0.1.0"
description = "SaaS Telegram Bot Multi-User + Web Admin Dashboard"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() trong default arg là hợp lệ

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
